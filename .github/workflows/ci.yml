name: CI Pipeline

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  lock-check:
    name: "📦 Check: uv.lock synchronization"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v4

      - name: "Set up uv"
        uses: astral-sh/setup-uv@v3

      - name: "Verify lockfile"
        run: uv lock --check

  security-audit:
    name: "🛡️ Security: pip-audit"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v4

      - name: "Set up uv"
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: "Run security audit"
        run: uv run pip-audit

  linting:
    name: "🔍 Lint: Ruff check"
    needs: lock-check
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v4

      - name: "Set up uv"
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: "Run linter"
        run: uv run ruff check .

  formatting:
    name: "🎨 Style: Ruff format check"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v4

      - name: "Set up uv"
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: "Check code formatting"
        run: uv run ruff format . --check

  type-checking:
    name: "🧪 Types: Mypy check"
    needs: lock-check
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v4

      - name: "Set up uv"
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: "Run type checker"
        run: uv run mypy .

  unit-tests:
    name: "🧪 Tests: Pytest & Coverage"
    needs: lock-check
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v4

      - name: "Set up uv"
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          python-version: "3.14"

      - name: "Run tests with coverage"
        run: uv run pytest --cov=src --cov-report=term-missing
