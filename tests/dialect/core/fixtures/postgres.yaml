import_path: "pyphrase.dialect.sql.postgres"
cases:
  complex_expression:
    1: >-
      (("foo" > 123) AND ("bar" IN (1, 2))) OR ("baz" IS NOT NULL)
    2: >-
      (("foo" > 123) AND ("bar" IN (1, 2))) OR (("baz" IS NOT NULL) AND ("blah" <> 'lorem ipsum'))

  constant:
    methods:
      "true": "TRUE"
      "false": "FALSE"
      "null": "NULL"
    values:
      integer: "25"
      float: "25.5678"
      string: "'lorem ipsum'"
      datetime: "'2000-01-02 03:04:05'"
      datetime_with_timezone: "'2000-01-02 13:04:05.678+00:00'"
      decimal: "25.25"
      none_value: "NULL"
    expression:
      and_true: >-
        "status" = 'active'
      is_null: >-
        "deleted_at" IS NULL
      is_not_null: >-
        "deleted_at" IS NOT NULL
  equality:
    equal:
      boolean: >-
        "status" = TRUE
      integer: >-
        "age" = 25
      float: >-
        "length" = 25.5678
      string: >-
        "name" = 'John'
      string_with_escaping: >-
        "name" = 'O''Reilly'
      datetime: >-
        "created_at" = '2000-01-02 03:04:05'
      datetime_with_timezone: >-
        "created_at" = '2000-01-02 13:04:05.678+00:00'
      decimal: >-
        "price" = 25.25
      none_value: >-
        "status" IS NULL
    not_equal:
      boolean: >-
        "status" <> TRUE
      integer: >-
        "age" <> 25
      float: >-
        "length" <> 25.5678
      string: >-
        "name" <> 'John'
      string_with_escaping: >-
        "name" <> 'O''Reilly'
      datetime: >-
        "created_at" <> '2000-01-02 03:04:05'
      datetime_with_timezone: >-
        "created_at" <> '2000-01-02 13:04:05.678+00:00'
      decimal: >-
        "price" <> 25.25
      none_value: >-
        "status" IS NOT NULL
    greater_than:
      integer: >-
        "age" > 25
      float: >-
        "length" > 25.5678
      datetime: >-
        "created_at" > '2000-01-02 03:04:05'
      datetime_with_timezone: >-
        "created_at" > '2000-01-02 13:04:05.678+00:00'
      decimal: >-
        "price" > 25.25
    greater_than_or_equal:
      integer: >-
        "age" >= 25
      float: >-
        "length" >= 25.5678
      datetime: >-
        "created_at" >= '2000-01-02 03:04:05'
      datetime_with_timezone: >-
        "created_at" >= '2000-01-02 13:04:05.678+00:00'
      decimal: >-
        "price" >= 25.25
    less_than:
      integer: >-
        "age" < 200
      float: >-
        "length" < 25.5678
      datetime: >-
        "created_at" < '2000-01-02 03:04:05'
      datetime_with_timezone: >-
        "created_at" < '2000-01-02 13:04:05.678+00:00'
      decimal: >-
        "price" < 25.25
    less_than_or_equal:
      integer: >-
        "age" <= 100
      float: >-
        "length" <= 25.5678
      datetime: >-
        "created_at" <= '2000-01-02 03:04:05'
      datetime_with_timezone: >-
        "created_at" <= '2000-01-02 13:04:05.678+00:00'
      decimal: >-
        "price" <= 25.25
    like: >-
      "product_name" LIKE 'Banana%'
    not_like: >-
      "sku" NOT LIKE 'OLD-%'
  logical:
    operator:
      and: >-
        ("age" > 25) AND ("status" = 'OK')
      or: >-
        ("age" > 25) OR ("status" = 'OK')
      precedence: >-
        ("a" = 1) OR (("b" = 2) AND ("c" = 3))
    inversion:
      and: >-
        ("age" <= 18) OR ("status" <> 'active')
      or: >-
        ("score" >= 0) AND ("score" <= 100)
      "true": "FALSE"
      not_true: "TRUE"
      "false": "TRUE"
      not_false: "FALSE"
      like: >-
        "product_name" NOT LIKE 'Banana%'
      not_like: >-
        "sku" LIKE 'OLD-%'
      in: >-
        "age" NOT IN (25, 26, 28)
      not_in: >-
        "age" IN (25, 26, 28)
      equal: >-
        "age" <> 25
      not_equal: >-
        "age" = 25
      greater_than: >-
        "age" <= 25
      greater_than_or_equal: >-
        "age" < 25
      less_than: >-
        "age" >= 25
      less_than_or_equal: >-
        "age" > 25
    constant_folding:
      true_and_true: "TRUE"
      true_or_true: "TRUE"
      false_and_false: "FALSE"
      false_or_false: "FALSE"
      x_and_true: >-
        "age" > 18
      x_and_false: "FALSE"
      true_and_x: >-
        "status" = 'active'
      false_and_x: "FALSE"
      x_or_true: "TRUE"
      x_or_false: >-
        "age" > 18
      complex_nested: >-
        "a" = 1
      with_de_morgan: "TRUE"
      or_true_left: "TRUE"
      and_true_left: >-
        "status" = 'active'
      or_false_left: >-
        "status" = 'active'
      or_true_right: "TRUE"
  in:
    integer: >-
      "age" IN (25, 26, 28)
    float: >-
      "score" IN (25.5, 26.67, 28.893)
    string: >-
      "name" IN ('lorem', 'ipsum')
    datetime: >-
      "start_time" IN ('2000-01-02 03:04:05', '2000-12-23 22:45:55')
    decimal: >-
      "price" IN (25.25, 26.67)
  not_in:
    integer: >-
      "age" NOT IN (25, 26, 28)
    float: >-
      "score" NOT IN (25.5, 26.67, 28.893)
    string: >-
      "name" NOT IN ('lorem', 'ipsum')
    datetime: >-
      "start_time" NOT IN ('2000-01-02 03:04:05', '2000-12-23 22:45:55')
    decimal: >-
      "price" NOT IN (25.25, 26.67)
  null_handling:
    is_null: >-
      "status" IS NULL
    is_not_null: >-
      "status" IS NOT NULL
