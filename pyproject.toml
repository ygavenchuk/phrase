[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyphrase"
version = "0.1.0a2"
description = "A lightweight, zero-dependency syntax builder for multiple dialects."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [
    { name = "Yurii Havenchuk" }
]
keywords = ["sql", "mongodb", "qgis", "query-builder", "ast", "compiler"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/ygavenchuk/phrase"
Documentation = "https://github.com/ygavenchuk/phrase"
Repository = "https://github.com/ygavenchuk/phrase.git"
Issues = "https://github.com/ygavenchuk/phrase/issues"

[dependency-groups]
dev = [
    "ruff>=0.8.4",
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "coverage>=7.6.0",
    "pip-audit>=2.8.0",
    "mypy>=2.0.0",
]

[tool.hatch.build.targets.sdist]
exclude = ["/.github", "/tests", ".gitignore"]

[tool.hatch.build.targets.wheel]
packages = ["src/phrase"]


[tool.ruff]
line-length = 90
target-version = "py314"

[tool.ruff.lint]
preview = true
select = [
    "A", # flake8-builtins
    "B", # flake8-bugbear
    "E", # pycodestyle errors
    "F", # pyflakes
    "I", # isort
    "N", # pep8-naming
    "Q", # flake8-quotes
    "S", # bandit
    "UP", # pyupgrade
    "W", # pycodestyle warnings
    "C4", # flake8-comprehensions
    "FA", # flake8-future-annotations
    "ANN", # flake8-annotations
    "ARG", # flake8-unused-arguments
    "C901", # complex structure
    "D213", # multi-line-summary-second-line
    "DOC", # pydoclint
    "ERA001", # Found commented-out code
    "ICN", # flake8-import-conventions
    "ISC", # flake8-implicit-str-concat
    "PIE", # flake8-pie
    "PERF", # Perfint
    "PLR0913", # Too many arguments in function definition
    "PLC", # Pylint
    "PLE", # Pylint errors
    "PLW", # Pylint warning
    "PTH", # flake8-use-pathlib
    "PYI", # flake8-pyi
    "RET", # flake8-return
    "RUF", # Ruff-specific rules
    "SIM", # flake8-simplify
    "SLF", # flake8-self
    "T20", # flake8-print
    "TCH", # flake8-type-checking
    "TID", # flake8-tidy-imports (circular imports)
    "TRY", # tryceratops
]
ignore = [
    "PLW1641", # eq without hash
    "S101", # assert
    "TRY003", # raise-vanilla-args
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.14"
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
strict = true
strict_equality = true
warn_no_return = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/test_*.py"]
data_file = ".reports/.coverage"

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false
precision = 2

[tool.coverage.xml]
output = ".reports/coverage.xml"

[tool.coverage.html]
directory = ".reports/htmlcov"

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
pythonpath = ["src"]
testpaths = ["tests"]
